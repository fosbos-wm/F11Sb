<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fallarbeit</title>
<style>
:root{--bg:#f2f5f7;--panel:#fff;--fg:#14222c;--muted:#566872;--line:#d3dde3;--pri:#2c8a52;--pri-ink:#fff;--ok:#1b7f4b;--ok-soft:#d9f0e2;--bad:#b3261e;--bad-soft:#f9dedc;--sel:#fff4d6}
@media (prefers-color-scheme:dark){:root{--bg:#0f171c;--panel:#17232a;--fg:#e6eff3;--muted:#9bb0ba;--line:#2a3b44;--pri:#6fd49b;--pri-ink:#062029;--ok:#6fd49b;--ok-soft:#163626;--bad:#ff9a92;--bad-soft:#40201e;--sel:#3a3418;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px max(14px,env(safe-area-inset-left,0px)) 40px;max-width:820px;margin-inline:auto}
h1{font-size:1.2rem;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.fall{border-left:5px solid #e8a317;background:var(--panel)}.fall h2{font-size:1rem;margin:0 0 6px}.fall p{margin:0;white-space:pre-line}
.tag{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.bar2{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 12px}.bar2>i{display:block;height:100%;background:var(--pri);transition:width .3s}
.opt,.ln{display:block;width:100%;text-align:left;background:var(--panel);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:10px 13px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover:not(:disabled),.ln:hover:not(:disabled){border-color:var(--pri)}
.opt.ok,.ln.ok{background:var(--ok-soft);border-color:var(--ok)}.opt.no,.ln.no{background:var(--bad-soft);border-color:var(--bad)}.ln.sel{background:var(--sel);border-color:#e8a317}
.fb{margin-top:10px;border-radius:12px;padding:10px 14px;background:var(--ok-soft);border-left:5px solid var(--ok)}.fb.bad{background:var(--bad-soft);border-color:var(--bad)}.fb p{margin:.3em 0}
.b{font:600 .95rem inherit;font-family:inherit;border-radius:10px;border:1px solid var(--pri);background:var(--pri);color:var(--pri-ink);padding:10px 18px;cursor:pointer;margin-top:10px}.b.alt{background:var(--panel);color:var(--fg);border-color:var(--line)}
textarea{width:100%;min-height:110px;font:inherit;border:2px solid var(--line);border-radius:10px;padding:9px;background:var(--panel);color:var(--fg)}
.chk label{display:flex;gap:8px;margin:6px 0;cursor:pointer}.chk input{accent-color:var(--pri);margin-top:4px}
.muster{background:var(--ok-soft);border-radius:10px;padding:10px 14px;margin:10px 0;white-space:pre-line}
.big{font-size:2.2rem;font-weight:800;color:var(--ok)}.done{text-align:center}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
</style></head><body>
<h1 id="t">Fallarbeit</h1><p class="sub" id="a"></p>
<div id="app"></div>
<script>
const QS=new URLSearchParams(location.search),TS=QS.get("ts")==="1",SET=(QS.get("set")||"").replace(/[^a-z0-9\-]/gi,"");
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D=null,part=0,i=0,sc={s:0,a:0,w:0},first=true,wrong=0,t0=Date.now(),sel={},aChecked=false;
const parts=()=>{const p=["s"];if(D.auszug)p.push("a");if(D.werkstatt)p.push("w");return p};
const maxS=()=>D.schritte.length,maxA=()=>D.auszug?D.auszug.zeilen.filter(z=>z[1]).length:0,maxW=()=>D.werkstatt?D.werkstatt.kriterien.length:0;
const total=()=>maxS()+maxA()+maxW();
function head(tag,pct){return `<div class="box fall"><h2>Fall</h2><p>${esc(D.fall)}</p></div><div class="box"><span class="tag">${esc(tag)}</span><div class="bar2"><i style="width:${pct}%"></i></div>`}
function view(){
  const P=parts();if(part>=P.length)return fin();
  const k=P[part];
  if(k==="s"){
    const q=D.schritte[i];
    $("app").innerHTML=head("Teil 1 · Entscheiden · "+q.t+" ("+(i+1)+"/"+maxS()+")",i/total()*100)+`<p><b>${esc(q.q)}</b></p><div id="o">${q.o.map((o,j)=>`<button class="opt" data-j="${j}" type="button">${esc(o[0])}</button>`).join("")}</div><div id="f"></div></div>`;
    first=true;document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.j,b));
  }else if(k==="a"){
    $("app").innerHTML=head("Teil 2 · Beurteilen",(maxS())/total()*100)+`<p><b>${esc(D.auszug.aufgabe)}</b></p><div id="z">${D.auszug.zeilen.map((z,j)=>`<button class="ln" data-j="${j}" type="button">${esc(z[0])}</button>`).join("")}</div><div id="f"></div><button class="b" id="chk" type="button">Prüfen</button></div>`;
    sel={};aChecked=false;
    document.querySelectorAll(".ln").forEach(b=>b.onclick=()=>{if(aChecked)return;b.classList.toggle("sel");sel[b.dataset.j]=b.classList.contains("sel")});
    $("chk").onclick=()=>{
      if(aChecked){part++;view();return}
      aChecked=true;let hit=0,miss=0,ex="";
      D.auszug.zeilen.forEach((z,j)=>{const b=document.querySelector('.ln[data-j="'+j+'"]'),s=!!sel[j];b.disabled=true;
        if(z[1]&&s){hit++;b.className="ln ok";ex+=`<p>✔ <b>Zeile ${j+1}:</b> ${esc(z[2])}</p>`}
        else if(z[1]&&!s){b.className="ln no";ex+=`<p>✘ <b>Zeile ${j+1} übersehen:</b> ${esc(z[2])}</p>`}
        else if(!z[1]&&s){miss++;b.className="ln no";ex+=`<p>✘ <b>Zeile ${j+1}</b> ist in Ordnung: ${esc(z[2]||"Das passt zum Text.")}</p>`}});
      sc.a=Math.max(0,hit-miss);wrong+=miss+(maxA()-hit);
      $("f").innerHTML=`<div class="fb"><p><b>${sc.a} von ${maxA()} Punkten.</b></p>${ex}</div>`;$("chk").textContent="Weiter";
    };
  }else{
    const W=D.werkstatt;
    $("app").innerHTML=head("Teil 3 · Gestalten · "+(W.titel||"Selbst formulieren"),(maxS()+maxA())/total()*100)+`<p><b>${esc(W.aufgabe)}</b></p><textarea id="ta" placeholder="Meine Lösung …"></textarea><button class="b" id="pr" type="button">Mit Musterlösung vergleichen</button><div id="f"></div></div>`;
    $("pr").onclick=()=>{
      if(!$("ta").value.trim()){$("ta").focus();return}
      $("ta").readOnly=true;$("pr").hidden=true;
      $("f").innerHTML=`<div class="muster"><b>Musterlösung (eine mögliche):</b>\n${esc(W.muster)}</div><p><b>Prüfe ehrlich, was deine Lösung enthält:</b></p><div class="chk">${W.kriterien.map((c,j)=>`<label><input type="checkbox" data-c="${j}"> ${esc(c)}</label>`).join("")}</div><button class="b" id="go" type="button">Abschließen</button>`;
      $("go").onclick=()=>{sc.w=document.querySelectorAll(".chk input:checked").length;part++;view()};
    };
  }
}
function pick(j,b){
  const o=D.schritte[i].o[j];
  if(!o[1]){b.classList.add("no");b.disabled=true;first=false;wrong++;$("f").innerHTML=`<div class="fb bad"><p>${esc(o[2])} Versuche es noch einmal.</p></div>`;return}
  if(first)sc.s++;
  document.querySelectorAll(".opt").forEach(x=>x.disabled=true);b.classList.add("ok");
  $("f").innerHTML=`<div class="fb"><p>${esc(o[2])}</p></div><button class="b" id="nx" type="button">Weiter</button>`;
  $("nx").onclick=()=>{i++;if(i>=maxS()){i=0;part++}view()};
}
function fin(){
  const pts=sc.s+sc.a+sc.w,tot=total(),secs=Math.round((Date.now()-t0)/1000);
  $("app").innerHTML=`<div class="box done"><div class="big">${pts} von ${tot}</div><p>Entscheiden ${sc.s}/${maxS()}${D.auszug?" · Beurteilen "+sc.a+"/"+maxA():""}${D.werkstatt?" · Selbst formuliert "+sc.w+"/"+maxW():""}</p><button class="b alt" id="again" type="button">Noch einmal</button></div>`;
  $("again").onclick=()=>{part=0;i=0;sc={s:0,a:0,w:0};wrong=0;t0=Date.now();view()};
  if(TS)try{parent.postMessage({tsResult:{punkte:pts,max:tot,zuege:wrong,sekunden:secs}},"*")}catch(e){}
}
fetch("../inhalte/"+SET+".json").then(r=>r.json()).then(d=>{D=d;$("t").textContent=d.titel;$("a").textContent=d.anleitung||"";view()}).catch(()=>{$("app").innerHTML='<div class="box">Die Aufgabe konnte nicht geladen werden.</div>'});
</script></body></html>
